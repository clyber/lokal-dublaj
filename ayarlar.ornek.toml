# Lokal Dublaj ayarları. Bu dosyayı "ayarlar.toml" adıyla kopyalayıp değiştir.
# Yazılmayan her alan varsayılanını alır (ortak.py → VARSAYILAN).

hedef_dil = "tr"            # şimdilik yalnız Türkçe denendi
cikti_klasoru = ""          # mp4 üretimi açıksa bitmiş videolar buraya taşınır (ör. "D:/Videolar/Dublaj")
calisma_klasoru = ""        # boş: uygulama klasörü/is (ara dosyalar, Türkçe ses dosyaları)
model_klasoru = ""          # boş: Hugging Face'in kendi önbelleği; ör. "E:/Modeller/HF"
js_ortami = "node"          # yt-dlp için: node ya da deno (biri kurulu olmalı)

[ceviri]
adres = "http://localhost:1234/v1"   # LM Studio (varsayılan) ya da Ollama: http://localhost:11434/v1
model = ""                           # boş: sunucudaki ilk model; ör. "gemma-4-12b-it"
grup_boyu = 20                       # bir istekte çevrilen cümle sayısı

[ses]
motor = "ema"               # ema (hızlı, tek Türkçe ses) · chatterbox (konuşmacıya benzer, yavaş) · piper
piper_sesi = ""             # piper seçilirse .onnx ses dosyasının yolu
ozgun_seviye = 0.15         # mp4'te özgün sesin seviyesi (0–1)
azami_hizlandirma = 1.35    # Türkçe cümle sığmazsa en çok bu kadar hızlandırılır

[video]
mp4_uret = false            # true: Türkçe sesli mp4 de üretilir (yalnız eklenti kullanılacaksa gerekmez)
azami_yukseklik = 720

[yaziya_dokme]
model = "mobiuslabsgmbh/faster-whisper-large-v3-turbo"

[sunucu]
port = 8799                 # değiştirirsen eklentideki adresi de değiştir
